name: "Auto-Branch Module Routing & AI Audit Engine"

on:
  push:
    branches:
      - main
    paths:
      - 'modules/**'
      - 'CryptoCore/**'
      - 'BIMParameters/**'
      - 'AKSEngine/**'
      - 'plugins/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      targetFolder:
        description: 'Nombre de la carpeta o módulo específico a ramificar y auditar'
        required: true
        default: 'CryptoCore'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  route-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install AI & Git Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai pyyaml gitpython

      - name: Detect Changed Modules & Directories
        id: detect_modules
        run: |
          echo "=== Detectando carpetas modificadas en el último commit ==="
          CHANGED_FOLDERS=$(git diff-tree --no-commit-id --name-only -r HEAD | grep '/' | cut -d/ -f1 | sort -u | tr '\n' ' ')
          
          if [ -z "$CHANGED_FOLDERS" ] && [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            CHANGED_FOLDERS="${{ github.event.inputs.targetFolder }}"
          fi
          
          echo "Carpetas detectadas: $CHANGED_FOLDERS"
          echo "modules=$CHANGED_FOLDERS" >> $GITHUB_OUTPUT

      - name: Create Isolated Branch per Module & Run AI Audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DETECTED_MODULES: ${{ steps.detect_modules.outputs.modules }}
        run: |
          python .github/scripts/ai_branch_auditor.py "$DETECTED_MODULES"

      - name: Push Module Branches & Artifacts
        run: |
          git config user.name "Gemini-Studio-Auditor[bot]"
          git config user.email "gemini-auditor@nodourb.dev"
          echo "Sincronizando ramas de módulos hacia origin..."
          # El script python maneja la creación y push de ramas modulares aisladas
