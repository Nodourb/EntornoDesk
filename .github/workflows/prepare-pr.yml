name: "Prepare Pull Request with AI Summary"

on:
  workflow_dispatch:
    inputs:
      sourceBranch:
        description: 'Rama de origen a preparar para PR (ej: modulo-CryptoCore)'
        required: true
        default: 'modulo-CryptoCore'
      targetBranch:
        description: 'Rama de destino para el PR (usualmente main)'
        required: true
        default: 'main'
      prTitle:
        description: 'Título del Pull Request'
        required: false
        default: 'feat(modulo): Integración de módulo auditado con IA'

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.sourceBranch }}

      - name: Create Pull Request with AI Audit Body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORT_FILE="AI_AUDIT_REPORT.md"
          if [ -f "$REPORT_FILE" ]; then
            PR_BODY=$(cat "$REPORT_FILE")
          else
            PR_BODY="Pull Request generado automáticamente por el sistema de orquestación de ramas inteligentes de EntornoDesk."
          fi

          gh pr create \
            --base "${{ github.event.inputs.targetBranch }}" \
            --head "${{ github.event.inputs.sourceBranch }}" \
            --title "${{ github.event.inputs.prTitle }}" \
            --body "$PR_BODY" || echo "El PR ya existe o no hay cambios pendientes."
